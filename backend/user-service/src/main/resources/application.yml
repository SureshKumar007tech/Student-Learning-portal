server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24 hours

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:${jwt.secret}}

portal:
  seed:
    enabled: ${PORTAL_SEED_ENABLED:false}
    student-password: ${PORTAL_SEED_STUDENT_PASSWORD:}
    admin-password: ${PORTAL_SEED_ADMIN_PASSWORD:}

logging:
  level:
    com.portal.user: INFO
    org.springframework.web: INFO
