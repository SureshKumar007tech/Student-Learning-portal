spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_resource_schema.sql,classpath:db/migration/V2__align_resource_schema_with_repository.sql

portal:
  seed:
    enabled: ${PORTAL_SEED_ENABLED:false}
