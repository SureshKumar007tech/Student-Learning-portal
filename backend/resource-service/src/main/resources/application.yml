server:
  port: 8083

spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:h2:mem:resource_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

logging:
  level:
    com.portal.resource: INFO

