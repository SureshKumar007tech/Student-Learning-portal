server:
  port: 8080

spring:
  application:
    name: api-gateway

gateway:
  routes:
    user-service: http://localhost:8081
    course-service: http://localhost:8082
    resource-service: http://localhost:8083
    engagement-service: http://localhost:8084
  internal-secret: ${GATEWAY_INTERNAL_SECRET:${jwt.secret}}

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

logging:
  level:
    com.portal.gateway: INFO


jwt:
  secret: ${JWT_SECRET}
