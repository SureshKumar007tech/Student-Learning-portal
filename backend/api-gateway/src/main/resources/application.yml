server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

gateway:
  routes:
    user-service: ${GATEWAY_ROUTES_USER_SERVICE:http://localhost:8081}
    course-service: ${GATEWAY_ROUTES_COURSE_SERVICE:http://localhost:8082}
    resource-service: ${GATEWAY_ROUTES_RESOURCE_SERVICE:http://localhost:8083}
    engagement-service: ${GATEWAY_ROUTES_ENGAGEMENT_SERVICE:http://localhost:8084}
  internal-secret: ${GATEWAY_INTERNAL_SECRET:${jwt.secret}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    com.portal.gateway: INFO


jwt:
  secret: ${JWT_SECRET}
