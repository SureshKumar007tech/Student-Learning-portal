server:
  port: 8082

spring:
  application:
    name: course-service
  datasource:
    url: jdbc:h2:mem:course_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

services:
  user-service-url: http://localhost:8081

logging:
  level:
    com.portal.course: INFO

