databases:
  - name: portal-postgres
    databaseName: portal_db
    plan: free
    postgresMajorVersion: "16"
    region: singapore

envVarGroups:
  - name: portal-shared-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_INTERNAL_SECRET
        generateValue: true

services:
  - type: web
    name: portal-user-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/user-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: portal-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORTAL_SEED_ENABLED
        value: "true"
      - key: PORTAL_SEED_STUDENT_PASSWORD
        sync: false
      - key: PORTAL_SEED_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString

  - type: web
    name: portal-course-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/course-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: portal-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORTAL_SEED_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString

  - type: web
    name: portal-resource-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/resource-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: portal-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORTAL_SEED_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString

  - type: web
    name: portal-engagement-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/engagement-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: portal-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORTAL_SEED_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString

  - type: web
    name: portal-api-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/gateway/status
    envVars:
      - fromGroup: portal-shared-secrets
      - key: GATEWAY_ROUTES_USER_SERVICE
        fromService:
          name: portal-user-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GATEWAY_ROUTES_COURSE_SERVICE
        fromService:
          name: portal-course-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GATEWAY_ROUTES_RESOURCE_SERVICE
        fromService:
          name: portal-resource-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GATEWAY_ROUTES_ENGAGEMENT_SERVICE
        fromService:
          name: portal-engagement-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
